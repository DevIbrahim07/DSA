<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      let arr = [9, 45, 2, 7, 4, 9];
      // traversing
      for (let i = 0; i < arr.length; i++) {
        document.write(` array ${i} ${arr[i]} <br>`);
      }

      // accessing
      let x = 2;
      document.write(` ${arr[x]}`);

      //

      function getelement() {
        let el = document.getElementById("ele").value;
        if (el < arr.length && typeof parseInt(el) === "number") {
          alert(arr[el]);
        } else {
          alert("please enter valid input");
        }
      }
    </script>
  </head>
  <body>
    <input type="text" id="ele" />
    <button onclick="getelement()">get element</button>
  </body>
</html>
